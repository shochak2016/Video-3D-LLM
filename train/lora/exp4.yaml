# Exp 4 LoRA fine-tune data mix.
# Default: ScanQA + Scan2Cap (the two tasks we have eval set up for).
# Drop one entry to halve runtime if you want a faster first pass.
datasets:
  - json_path: data/processed/scanqa_train_llava_style.json
    sampling_strategy: "all"
  - json_path: data/processed/scan2cap_train_llava_style.json
    sampling_strategy: "all"
