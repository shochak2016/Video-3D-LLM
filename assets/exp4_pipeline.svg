<svg viewBox="0 0 1580 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1580" height="600" fill="#f7f8fb"/>
  <text x="30" y="40" font-size="26" font-weight="700" fill="#0f172a">Exp 4 pipeline — voxel-cluster crops (2-object scene)</text>
  <text x="30" y="64" font-size="14" fill="#64748b">chair = cluster 0 (blue) · table = cluster 1 (orange)</text>

  <!-- ===== arrows between stages ===== -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <g stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)" fill="none">
    <line x1="300" y1="320" x2="338" y2="320"/>
    <line x1="600" y1="320" x2="638" y2="320"/>
    <line x1="900" y1="320" x2="938" y2="320"/>
    <line x1="1200" y1="320" x2="1238" y2="320"/>
  </g>

  <!-- ============ STAGE 1: voxel map ============ -->
  <g>
    <rect x="30" y="100" width="270" height="380" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="52" cy="122" r="13" fill="#0f172a"/><text x="52" y="127" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="75" y="127" font-size="15" font-weight="700" fill="#0f172a">Scene voxel map</text>
    <text x="48" y="500" font-size="12.5" fill="#475569">nvblox TSDF over depth</text>
    <text x="48" y="518" font-size="12.5" fill="#475569">frames → surface voxels</text>
    <!-- faint floor grid -->
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="55" y1="430" x2="275" y2="430"/><line x1="80" y1="410" x2="275" y2="410"/>
      <line x1="80" y1="160" x2="80" y2="430"/><line x1="160" y1="160" x2="160" y2="430"/><line x1="240" y1="160" x2="240" y2="430"/>
    </g>
    <!-- chair cluster (blue voxels) -->
    <g fill="#2563eb" opacity="0.9">
      <rect x="92" y="300" width="14" height="14"/><rect x="108" y="300" width="14" height="14"/><rect x="92" y="316" width="14" height="14"/><rect x="108" y="316" width="14" height="14"/>
      <rect x="92" y="240" width="14" height="14"/><rect x="92" y="256" width="14" height="14"/><rect x="92" y="272" width="14" height="14"/><rect x="92" y="288" width="14" height="14"/>
      <rect x="108" y="240" width="14" height="14"/>
    </g>
    <!-- table cluster (orange voxels) -->
    <g fill="#ea580c" opacity="0.9">
      <rect x="178" y="330" width="14" height="14"/><rect x="194" y="330" width="14" height="14"/><rect x="210" y="330" width="14" height="14"/><rect x="226" y="330" width="14" height="14"/><rect x="242" y="330" width="14" height="14"/>
      <rect x="178" y="346" width="14" height="14"/><rect x="242" y="346" width="14" height="14"/>
      <rect x="178" y="362" width="14" height="14"/><rect x="242" y="362" width="14" height="14"/>
    </g>
  </g>

  <!-- ============ STAGE 2: DBSCAN clusters ============ -->
  <g>
    <rect x="338" y="100" width="270" height="380" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="360" cy="122" r="13" fill="#0f172a"/><text x="360" y="127" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="383" y="127" font-size="15" font-weight="700" fill="#0f172a">DBSCAN → clusters</text>
    <text x="356" y="500" font-size="12.5" fill="#475569">cluster surface voxels by</text>
    <text x="356" y="518" font-size="12.5" fill="#475569">XYZ (spatial gaps split)</text>
    <!-- chair voxels + dashed boundary -->
    <g fill="#2563eb" opacity="0.9">
      <rect x="400" y="300" width="14" height="14"/><rect x="416" y="300" width="14" height="14"/><rect x="400" y="316" width="14" height="14"/><rect x="416" y="316" width="14" height="14"/>
      <rect x="400" y="240" width="14" height="14"/><rect x="400" y="256" width="14" height="14"/><rect x="400" y="272" width="14" height="14"/><rect x="400" y="288" width="14" height="14"/><rect x="416" y="240" width="14" height="14"/>
    </g>
    <rect x="388" y="228" width="58" height="108" rx="14" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5 4"/>
    <text x="388" y="222" font-size="12" font-weight="700" fill="#2563eb">cluster 0</text>
    <!-- table voxels + dashed boundary -->
    <g fill="#ea580c" opacity="0.9">
      <rect x="486" y="330" width="14" height="14"/><rect x="502" y="330" width="14" height="14"/><rect x="518" y="330" width="14" height="14"/><rect x="534" y="330" width="14" height="14"/><rect x="550" y="330" width="14" height="14"/>
      <rect x="486" y="346" width="14" height="14"/><rect x="550" y="346" width="14" height="14"/><rect x="486" y="362" width="14" height="14"/><rect x="550" y="362" width="14" height="14"/>
    </g>
    <rect x="476" y="322" width="98" height="62" rx="14" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="5 4"/>
    <text x="476" y="316" font-size="12" font-weight="700" fill="#ea580c">cluster 1</text>
  </g>

  <!-- ============ STAGE 3: project to frame + bbox ============ -->
  <g>
    <rect x="638" y="100" width="270" height="380" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="660" cy="122" r="13" fill="#0f172a"/><text x="660" y="127" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="683" y="127" font-size="15" font-weight="700" fill="#0f172a">Project → 2D bbox</text>
    <text x="656" y="500" font-size="12.5" fill="#475569">project each cluster's voxels</text>
    <text x="656" y="518" font-size="12.5" fill="#475569">into a frame → tight bbox</text>
    <!-- the camera frame (an RGB image) -->
    <rect x="668" y="160" width="210" height="270" rx="6" fill="#eef2f7" stroke="#94a3b8"/>
    <text x="672" y="178" font-size="11" fill="#64748b">one video frame (RGB)</text>
    <!-- chair in frame (tall, narrow) -->
    <rect x="708" y="232" width="40" height="150" rx="4" fill="#2563eb" opacity="0.45"/>
    <rect x="700" y="224" width="56" height="166" fill="none" stroke="#2563eb" stroke-width="3"/>
    <text x="700" y="218" font-size="11" font-weight="700" fill="#2563eb">bbox 0</text>
    <!-- table in frame (wide, short) -->
    <rect x="788" y="338" width="78" height="44" rx="4" fill="#ea580c" opacity="0.45"/>
    <rect x="780" y="330" width="94" height="60" fill="none" stroke="#ea580c" stroke-width="3"/>
    <text x="780" y="324" font-size="11" font-weight="700" fill="#ea580c">bbox 1</text>
  </g>

  <!-- ============ STAGE 4: crop + stretch to 384 ============ -->
  <g>
    <rect x="938" y="100" width="270" height="380" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="960" cy="122" r="13" fill="#0f172a"/><text x="960" y="127" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="983" y="127" font-size="15" font-weight="700" fill="#0f172a">Crop → stretch to 384²</text>
    <text x="956" y="498" font-size="12.5" fill="#475569">anisotropic resize (aspect</text>
    <text x="956" y="516" font-size="12.5" fill="#475569">distorted). RGB(bilinear) +</text>
    <text x="956" y="534" font-size="12.5" fill="#475569">per-patch XYZ(nearest, masked)</text>
    <!-- crop 0: chair stretched (tall->square => fat) -->
    <g>
      <rect x="968" y="158" width="120" height="120" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <rect x="986" y="172" width="84" height="92" rx="4" fill="#2563eb" opacity="0.5"/>
      <g stroke="#1e3a8a" stroke-width="0.5" opacity="0.5">
        <line x1="968" y1="188" x2="1088" y2="188"/><line x1="968" y1="218" x2="1088" y2="218"/><line x1="968" y1="248" x2="1088" y2="248"/>
        <line x1="998" y1="158" x2="998" y2="278"/><line x1="1028" y1="158" x2="1028" y2="278"/><line x1="1058" y1="158" x2="1058" y2="278"/>
      </g>
      <text x="1096" y="200" font-size="11" font-weight="700" fill="#2563eb">crop 0</text>
      <text x="1096" y="216" font-size="10" fill="#64748b">384×384</text>
      <text x="1096" y="232" font-size="10" fill="#64748b">14×14 grid</text>
    </g>
    <!-- crop 1: table stretched (wide->square => tall) -->
    <g>
      <rect x="968" y="300" width="120" height="120" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
      <rect x="982" y="322" width="92" height="74" rx="4" fill="#ea580c" opacity="0.5"/>
      <g stroke="#7c2d12" stroke-width="0.5" opacity="0.5">
        <line x1="968" y1="330" x2="1088" y2="330"/><line x1="968" y1="360" x2="1088" y2="360"/><line x1="968" y1="390" x2="1088" y2="390"/>
        <line x1="998" y1="300" x2="998" y2="420"/><line x1="1028" y1="300" x2="1028" y2="420"/><line x1="1058" y1="300" x2="1058" y2="420"/>
      </g>
      <text x="1096" y="342" font-size="11" font-weight="700" fill="#ea580c">crop 1</text>
      <text x="1096" y="358" font-size="10" fill="#64748b">384×384</text>
      <text x="1096" y="374" font-size="10" fill="#64748b">14×14 grid</text>
    </g>
  </g>

  <!-- ============ STAGE 5: SigLIP ============ -->
  <g>
    <rect x="1238" y="100" width="312" height="380" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="1260" cy="122" r="13" fill="#0f172a"/><text x="1260" y="127" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <text x="1283" y="127" font-size="15" font-weight="700" fill="#0f172a">SigLIP-v1 encode + PE</text>

    <rect x="1262" y="170" width="264" height="64" rx="8" fill="#0f172a"/>
    <text x="1394" y="200" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">SigLIP-so400m</text>
    <text x="1394" y="220" font-size="11.5" fill="#cbd5e1" text-anchor="middle">patch14 · 384² · frozen</text>

    <line x1="1394" y1="234" x2="1394" y2="262" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>

    <rect x="1262" y="266" width="264" height="50" rx="8" fill="#eef2f7" stroke="#94a3b8"/>
    <text x="1394" y="288" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">729 → 2D-pool → 14×14 tokens/crop</text>
    <text x="1394" y="306" font-size="11.5" fill="#475569" text-anchor="middle">+ sin3d PE from per-patch XYZ</text>

    <line x1="1394" y1="316" x2="1394" y2="344" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>

    <rect x="1262" y="348" width="264" height="56" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="1394" y="372" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">append as extra "frames"</text>
    <text x="1394" y="390" font-size="11.5" fill="#166534" text-anchor="middle">to uniform video tokens → Qwen2 LLM</text>

    <text x="1256" y="438" font-size="12.5" fill="#475569">N crops (≤ max_crops) × 196 tokens,</text>
    <text x="1256" y="456" font-size="12.5" fill="#475569">each token carries its cluster's 3D coord</text>
  </g>
</svg>
